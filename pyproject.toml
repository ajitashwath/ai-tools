[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidev"
version = "0.1.0"
description = "AI DevTools - local-first AI debugging and experimentation platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tracing", "observability", "debugging", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
]

[project.scripts]
aidev = "aidev.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["aidev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE", "PLW", "BLE", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
